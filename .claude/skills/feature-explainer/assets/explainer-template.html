<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- FILL: page name. A short noun phrase, no explainer after a dash. -->
<title>Feature Explainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;700&family=Caveat:wght@500;700&family=Architects+Daughter&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }

/* Light palette. Neutrals are hue-biased toward the accent, not flat grey.
   Swap these for the subject's own world; keep all three theme blocks in sync. */
:root {
  --paper:#E7EDF3; --grid:#D2DDE8; --card:#F8FAFC;
  --ink:#0F2033; --ink-2:#4A5D73;
  --wire:#0B6E7F; --signal:#D9480F; --stop:#A61E2B; --go:#2B7A3D;
  --edge:#C3D0DE;
  --shadow:0 1px 0 #FFFFFF inset, 0 2px 14px rgba(15,32,51,.09);
  --board:#FCF8ED; --board-edge:#D8CDB4; --marker:#21303D;
  --mk-blue:#14688F; --mk-red:#B33A2B; --mk-green:#2C7A4F; --mk-amber:#C97A12;
  --hl:rgba(240,196,25,.42); --sticky:#FBE9A0; --sticky-edge:#E3CB6E;
  --f-display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --f-body:"Source Sans 3",-apple-system,BlinkMacSystemFont,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
/* System-dark: the default state, where nothing is stamped on <html>. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:#0C1620; --grid:#17242F; --card:#131F2B;
    --ink:#E6EDF4; --ink-2:#94A8BC;
    --wire:#3BB3C6; --signal:#FF8A4C; --stop:#FF6B7A; --go:#63C77D;
    --edge:#24343F;
    --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 2px 14px rgba(0,0,0,.4);
    --board:#101A22; --board-edge:#2A3946; --marker:#E8F1F7;
    --mk-blue:#6BC7EA; --mk-red:#FF8D7F; --mk-green:#77DCA2; --mk-amber:#F2B45C;
    --hl:rgba(242,180,92,.28); --sticky:#3B3418; --sticky-edge:#6B5D28;
  }
}
/* Explicit dark choice must also win over a light OS. */
:root[data-theme="dark"] {
  --paper:#0C1620; --grid:#17242F; --card:#131F2B;
  --ink:#E6EDF4; --ink-2:#94A8BC;
  --wire:#3BB3C6; --signal:#FF8A4C; --stop:#FF6B7A; --go:#63C77D;
  --edge:#24343F;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 2px 14px rgba(0,0,0,.4);
  --board:#101A22; --board-edge:#2A3946; --marker:#E8F1F7;
  --mk-blue:#6BC7EA; --mk-red:#FF8D7F; --mk-green:#77DCA2; --mk-amber:#F2B45C;
  --hl:rgba(242,180,92,.28); --sticky:#3B3418; --sticky-edge:#6B5D28;
}

body {
  margin:0; background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--ink); font-family:var(--f-body); font-size:18px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wrap { max-width:860px; margin:0 auto; padding:0 20px 96px; }

.hero { padding:88px 0 40px; }
.eyebrow { font-family:var(--f-mono); font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--wire); margin:0 0 18px; }
h1 { font-family:var(--f-display); font-weight:800; font-size:clamp(40px,8vw,76px); line-height:.98; letter-spacing:-.02em; text-wrap:balance; margin:0 0 20px; }
.standfirst { font-size:clamp(19px,2.4vw,23px); color:var(--ink-2); max-width:34em; margin:0; }

/* Vertical signal wire. Each beat is a node on it. */
.track { position:relative; padding-left:46px; }
.track::before { content:""; position:absolute; left:11px; top:10px; bottom:0; width:2px; background:repeating-linear-gradient(var(--edge) 0 8px,transparent 8px 14px); }
.node { position:relative; padding:44px 0; }
.node::before { content:""; position:absolute; left:-41px; top:56px; width:14px; height:14px; border-radius:50%; background:var(--paper); border:3px solid var(--wire); }
.node.is-hot::before { border-color:var(--signal); }   /* the non-obvious beat */
.node.is-stop::before { border-color:var(--stop); }    /* the trap beat */

h2 { font-family:var(--f-display); font-weight:800; font-size:clamp(27px,4vw,38px); line-height:1.08; letter-spacing:-.015em; text-wrap:balance; margin:0 0 12px; }
.node > p { max-width:32em; margin:0 0 18px; }
.node > p:last-child { margin-bottom:0; }
strong { font-weight:600; color:var(--ink); }

.panel { background:var(--card); border:1px solid var(--edge); border-radius:10px; box-shadow:var(--shadow); padding:22px; margin:22px 0; overflow-x:auto; }
.panel-label { font-family:var(--f-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-2); margin:0 0 14px; }

.code { font-family:var(--f-mono); font-size:14.5px; line-height:2; white-space:pre; }
.code .k { color:var(--wire); font-weight:700; }
.code .v { color:var(--signal); }
.code .dim { color:var(--ink-2); }
.line { display:block; padding:0 8px; border-radius:4px; }
.line.moved { background:color-mix(in srgb,var(--signal) 16%,transparent); }
.line.late  { background:color-mix(in srgb,var(--stop) 14%,transparent); }

.compare { display:grid; gap:16px; grid-template-columns:1fr; margin:22px 0; }
@media (min-width:720px) { .compare { grid-template-columns:1fr 1fr; } }
.compare .panel { margin:0; }
.tag { display:inline-block; font-family:var(--f-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; padding:3px 8px; border-radius:4px; margin-bottom:12px; }
.tag.bad { color:var(--stop); background:color-mix(in srgb,var(--stop) 14%,transparent); }
.tag.good { color:var(--go); background:color-mix(in srgb,var(--go) 16%,transparent); }

svg { display:block; max-width:100%; height:auto; }
.dg-label { font-family:var(--f-mono); font-size:12px; fill:var(--ink-2); letter-spacing:.06em; }
.dg-title { font-family:var(--f-display); font-size:17px; font-weight:800; fill:var(--ink); }
.dg-box { fill:var(--card); stroke:var(--edge); stroke-width:2; }
.dg-wire { stroke:var(--wire); stroke-width:2.5; fill:none; }
.dg-hot { stroke:var(--signal); stroke-width:3; fill:none; }

.callout { border-left:4px solid var(--signal); background:color-mix(in srgb,var(--signal) 8%,var(--card)); border-radius:0 8px 8px 0; padding:16px 20px; margin:22px 0; }
.callout.stop { border-left-color:var(--stop); background:color-mix(in srgb,var(--stop) 8%,var(--card)); }
.callout p { margin:0; max-width:none; }

.punch { font-family:var(--f-display); font-weight:800; font-size:clamp(24px,3.6vw,33px); line-height:1.16; letter-spacing:-.015em; text-wrap:balance; margin:26px 0; color:var(--ink); }
.punch em { font-style:normal; color:var(--signal); }

/* Whiteboard breaks out of the reading column. Without this the diagram is
   wider than 860px and its right-hand boxes hide behind a scrollbar. */
.board-section { margin-top:72px; width:min(1180px,calc(100vw - 32px)); margin-left:50%; transform:translateX(-50%); }
.board-section > h2, .board-section > p { margin-left:auto; margin-right:auto; max-width:820px; }
.board-section > p { color:var(--ink-2); margin-bottom:22px; }
.board { background:var(--board); border:1px solid var(--board-edge); border-radius:12px; box-shadow:var(--shadow); padding:10px; overflow-x:auto; }
.board svg { width:100%; height:auto; min-width:720px; }
.hand { font-family:"Architects Daughter","Comic Sans MS",cursive; fill:var(--marker); }
.hand-big { font-family:"Caveat","Comic Sans MS",cursive; font-weight:700; fill:var(--marker); }
.ink { stroke:var(--marker); stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.ink-2 { stroke:var(--marker); stroke-width:1.6; fill:none; stroke-linecap:round; opacity:.55; }
.blue { stroke:var(--mk-blue); stroke-width:2.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.red { stroke:var(--mk-red); stroke-width:2.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.green { stroke:var(--mk-green); stroke-width:2.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.amber { stroke:var(--mk-amber); stroke-width:2.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.fill-sticky { fill:var(--sticky); stroke:var(--sticky-edge); stroke-width:2; }
.hl-bar { fill:var(--hl); }

footer { margin-top:56px; padding-top:22px; border-top:1px solid var(--edge); font-family:var(--f-mono); font-size:12.5px; color:var(--ink-2); }
a { color:var(--wire); }
a:focus-visible { outline:3px solid var(--signal); outline-offset:3px; }
@media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <!-- FILL: eyebrow, h1 (the page's name), standfirst (what the reader gains, no jargon) -->
    <p class="eyebrow">Explain it simply / subject</p>
    <h1>Headline goes here</h1>
    <p class="standfirst">One or two sentences. What changed, and why a reader should care.</p>
  </header>

  <div class="track">

    <!-- FILL: one <section class="node"> per beat, 5 to 8 total.
         Add is-hot to the non-obvious beat, is-stop to the trap beat.
         Components available inside a node, use only what the beat needs:
           .panel + .panel-label      wrapper for code or a diagram
           .code with .k .v .dim      syntax-coloured block
           .compare + .tag.bad/.good  wrong vs right, side by side
           .callout / .callout.stop   an aside worth boxing
           .punch with <em>           the one-line lesson, at most one per beat
           inline <svg> using .dg-*   a flow diagram
    -->
    <section class="node">
      <h2>First beat</h2>
      <p>One idea. Short sentences.</p>
      <div class="panel">
        <p class="panel-label">label</p>
        <svg viewBox="0 0 700 150" role="img" aria-label="Describe the diagram for screen readers">
          <rect class="dg-box" x="8" y="26" width="190" height="98" rx="8"/>
          <text class="dg-title" x="30" y="60">source</text>
          <path class="dg-hot" d="M206 75 H470"/>
          <path class="dg-hot" d="M456 66 l16 9 l-16 9"/>
          <rect class="dg-box" x="480" y="26" width="212" height="98" rx="8"/>
          <text class="dg-title" x="504" y="60">destination</text>
        </svg>
      </div>
    </section>

  </div>

  <section class="board-section">
    <h2>The whiteboard version</h2>
    <p>One picture for the team stand-up.</p>
    <div class="board">
      <!-- FILL: see references/hand-drawn-svg.md for the shape recipes and layout maths.
           Three zones with dashed dividers: 1 the wiring, 2 the why, 3 the trap.
           Keep all x within 30..890 of the viewBox so nothing clips. -->
      <svg viewBox="0 0 920 760" role="img" aria-label="Describe the whole board for screen readers">
        <text class="hand-big" x="34" y="46" font-size="34">Board title</text>
        <rect class="hl-bar" x="30" y="52" width="300" height="12" rx="6"/>
        <text class="hand" x="34" y="96" font-size="15" style="fill:var(--mk-blue)">1. THE WIRING</text>
        <path class="ink-2" d="M34,286 C240,281 500,289 886,283" stroke-dasharray="9 11"/>
        <text class="hand" x="34" y="322" font-size="15" style="fill:var(--mk-red)">2. THE WHY</text>
        <path class="ink-2" d="M34,548 C240,543 500,551 886,545" stroke-dasharray="9 11"/>
        <text class="hand" x="34" y="584" font-size="15" style="fill:var(--mk-red)">3. THE TRAP</text>
      </svg>
    </div>
  </section>

  <!-- FILL: provenance. Keep the "not committed" note. -->
  <footer>subject &nbsp;·&nbsp; key files &nbsp;·&nbsp; scratch file, not committed</footer>

</div>
</body>
</html>
